# Configuration for the scheduled external link check (lychee).
# DOI resolvers and PubPub reject automated HEAD requests, so they are excluded;
# the DOI-to-Zenodo relationship is checked by Zenodo, not by us.
# LinkedIn answers automated requests with 999 on every country subdomain, and
# future host sites (nime2027/2028) are announced before the domains go live.
max_concurrency = 4
max_retries = 2
timeout = 30
accept = ["200..=299", "403"]
exclude_path = ["_site/web_archive", "_site/proceedings"]
exclude = [
  "^https?://doi\\.org/",
  "^https?://dx\\.doi\\.org/",
  "^https?://nime\\.pubpub\\.org/",
  "^https?://([a-z]{2}\\.|www\\.)?linkedin\\.com/",
  "^https?://(www\\.)?twitter\\.com/",
  "^https?://x\\.com/",
  "^https?://(www\\.)?facebook\\.com/",
  "^mailto:",
  # Future host sites that have not been stood up yet.
  "^https?://nime202[789]\\.org/",
]
