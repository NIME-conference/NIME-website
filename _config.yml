title: NIME
email: website@nime.org
description: >-
  The International Conference on New Interfaces for Musical Expression
  gathers researchers and musicians from all over the world to share their
  knowledge and late-breaking work on new musical interface design.
baseurl: ""
url: "https://nime.org" 

encoding: utf-8 
lang: en-GB 
logo: "/assets/logos/nime.png"
css_inline: true

markdown: kramdown
# Settings the github-pages gem used to force; kept so output is unchanged.
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
# Fail the build on a typo in a Liquid filter or variable, rather than silently
# emitting an empty string (a link to a missing filter once became "/nime2026_27").
liquid:
  strict_filters: true
  strict_variables: false
  gfm_quirks: paragraph_end
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
permalink: pretty 
excerpt_separator: <!-- more -->
timezone: Europe/London

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-toc
  - jekyll-seo-tag
 
# Individual pages for the proceedings entries (papers, music, installations,
# alt.nime) are generated by _plugins/proceedings_pages.rb, one per record in
# the data files below. Pages for the years in `moved_years` are written next
# to their PDFs as /proceedings/<year>/<id>.html, which is what Google Scholar
# asks for (#89); their old /<legacy_dir>/<id>/ URLs are 301-redirected from
# .htaccess. All other years stay at /<legacy_dir>/<id>/.
#
# Pilot (#89): one old, long-indexed year and the newest year. Compare Scholar's
# coverage of these against neighbouring years before adding more.
proceedings_pages:
  moved_years: [2001, 2026]
  sets:
    - data: nime_papers
      legacy_dir: proc
    - data: nime_music
      legacy_dir: proc_music
    - data: nime_installations
      legacy_dir: proc_installations
    - data: nime_alt
      legacy_dir: proc_alt

social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  link: http://nime.org
  RSS: /feed.xml
    
exclude:
- README.md
- scripts/
- .lychee.toml
- Gemfile
- Gemfile.lock
- node_modules
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/


navigation_header:
- title: Hosting
  url: /hosting/
- title: Past NIMEs
  url: /past-nimes/
- title: Proceedings
  dropdown:
    - title: Paper
      url: /papers/
    - title: Music
      url: /music/
    - title: Installation
      url: /installations/
    - title: alt.nime
      url: /alt/
- title: About
  dropdown:
    - title: Statements
      url: /statements/
    - title: Board
      url: /board/
    - title: Committees
      url: /committees/
    - title: Communities
      url: /communities/
    - title: Mentorship
      url: /mentorship/
- title: Connect
  dropdown:
    - title: Mailing List
      url: /mailinglist/
    - title: Forum
      url: https://forum.nime.org/
    - title: Social
      url: /social/
- title: Resources
  dropdown:
    - title: Off-NIME
      url: https://idmil.github.io/off-nime/

collections:
  posts:
    title: Posts # Needed for Siteleaf
    output: true
    description: "News from the NIME world" # The post list page content
    feature_image: "/assets/headers/nime2010-ultrasonic.jpg"
    feature_text: ""
