<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-GB" }}">
<head>
  {% include head.html entry=page.entry %}
  {%- if page.entry %}
  <!-- Google Scholar / Highwire metadata for proceedings entries -->
  {% include entry_metadata.html entry=page.entry %}
  {%- endif %}
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="container">
    {% include nav.html %}
  </header>

  {% if page.feature_image %}
  <div class="feature">
    <img src="{{ page.feature_image | relative_url }}" alt="{{ page.feature_image_alt | default: '' }}">
  </div>
  {% endif %}

  <main id="main" class="container">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
