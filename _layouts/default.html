<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-GB" }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="visually-hidden-focusable d-block p-2 text-center" href="#main">Skip to content</a>
    <header>
    {% include nav.html %}
    {% if page.feature_image %}
    <div class="mx-0 px-0 bg-transparent container-fluid">
      <div class="row justify-content-between mx-0 px-0">
          <img src="{{ page.feature_image | relative_url }}" class="img-fluid p-0 m-0" alt="{{ page.feature_image_alt | default: '' }}" />
      </div>
    </div>
    {% endif %}
    </header>
    <div class="container rounded bg-body">    
      <main id="main" class="my-2 p-4" aria-label="Content">
        {{ content }}
      </main>
    </div>
    {% include footer.html %}
    {% include scripts.html %}
  </body>
</html>
