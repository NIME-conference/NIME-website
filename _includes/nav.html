<nav aria-label="Main">
  <ul>
    <li>
      <a class="logo" href="{{ '/' | relative_url }}">
        <img src="{% link /assets/logos/nime.svg %}" alt="NIME home">
      </a>
    </li>
  </ul>
  <ul>
    {%- for link in site.navigation_header %}
    {%- if link.dropdown %}
    <li>
      <details class="dropdown">
        <summary>{{ link.title }}</summary>
        <ul>
          {%- for item in link.dropdown %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {%- endfor %}
        </ul>
      </details>
    </li>
    {%- else %}
    <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
    {%- endif %}
    {%- endfor %}
  </ul>
</nav>
