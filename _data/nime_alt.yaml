- ENTRYTYPE: inproceedings
  ID: nime2026_alt_13
  abstract: 'As artificial intelligence continues to become embedded in musical instrument
    design, this Alt.NIME paper proposes examining how data is used in any such system.
    It extends the concept of small data beyond dataset size alone, proposing a framework
    that emphasises limited, self-curated, marginalised, and situated datasets. To
    explore current practices, we conduct an exploratory audit of submissions to the
    NIME 2026 proceedings that employ artificial intelligence or data-driven techniques.
    The audit investigates how datasets aredescribed, whether their sources are documented
    and accessible, and the extent to which smaller or situated datasets are used.
    Through this investigation, we aim to highlight the visibility (or absence) of
    dataset transparency within NIME research.'
  address: 'London, United Kingdom'
