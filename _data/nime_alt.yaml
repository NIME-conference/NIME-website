- ENTRYTYPE: inproceedings
  ID: nime2026_alt_5
  abstract: 'The 15-step pyramid tala by mridangam percussionist B C Manjunath is
    introduced, as a frame for exploring algorithmicmusic through reciting syllables,
    without the use of a computer. The authors share their self-reports on learning
    to clap thetala while reciting patterns of syllables, and transforming them through
    algorithmic procedures inspired by South Indian,Carnatic rhythms. The experience
    of taking an embodied approach to learning algorithmic patterns is reflected on,
    interms of the relationship between simple rules with complex results, the value
    of learning to perform algorithms manually,the potential for inspiring new live
    coding languages, and the relationship between algorithmic musician and audience.'
