- ENTRYTYPE: inproceedings
  ID: nime2026_alt_3
  abstract: 'Connecting with nature, spirits, histories, and the emergent and experiential
    dimensions of sound, we resist performativeegotism and challenge technosolutionism
    in music technology through séance. Spirit mediums - human vessels thatinteract
    with, channel, or anthropomorphise spirits - are cultural links between humans,
    animals, and the surroundingenvironment. In Western contexts, the medium conducts
    a specialist practice of discovering and performing techniquesto call upon spirits;
    however, it is our position that anyone has the potential to become a spirit medium,
    just as anyonehas creative voice. Using a collection of musical instruments, both
    acoustic and electronically augmented, we propose anopportunity to spiritually
    connect with the land and its spirits near the Loughborough University London
    (LUL) campus.The séance overlaps ritual practices of experimental music-making,
    healing of the connection between humans and land,and spiritual grounding through
    meditative exercises. In light of technologically-enforced severances between
    humansand spirits, we activate our potential as mediums, and use instruments as
    conduits for rebuilding connection with thesame earth that this conference stands
    on.'
  address: 'London, United Kingdom'
