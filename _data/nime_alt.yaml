- ENTRYTYPE: inproceedings
  ID: nime2026_alt_1
  abstract: 'The Latin American (LATAM) NIME Network was created in 2021 by a group
    of LATAM academics and artists. Since its creation the network has explored ways
    of bringing LATAM NIME practitioners together through various initiatives such
    as academic papers, workshops, gatherings and mentorship programmes. With this
    zine our aim is to share previous and upcoming works from members of the LATAM
    NIME community. We gathered the zine''s 13 entries through an open call in the
    LATAM NIME Community WhatsApp group. Contributors are artists, technologists,
    musicians, researchers, and educators from Argentina, Brazil, Chile, Colombia,
    and Mexico. The works featured range from digital musical instruments, software
    instruments, mobile applications and neural synthesis. These also explore decolonial
    perspectives, building upon ancestral rituals and Latin American narratives and
    traditions.'
