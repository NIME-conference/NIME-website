- ENTRYTYPE: inproceedings
  ID: nime2026_alt_12
  abstract: 'At this point, a philosophical question arises as to which implementation
    more authentically embodies the spirit of John Cage’s 4’33". The one-line version
    (Implementation B) could be considered the most minimal version possible—perhaps
    the “Platonic ideal” of 4’33" as expressed in the strongly-timed syntax and semantics
    of the ChucK programming language, in so far as the above program is the passage
    of a specific duration of time “in silence”; the absence of unit generators implies
    a zero-amplitude audio output. The computer musician writing/running this code
    draws parallels to the pianist sitting in front of a piano, which is not only
    capable of making sound but also carries strong cultural expectations to make
    sound, and yet the pianist chooses, in this case, to proactively not make sound.
    This implementation, therefore, could be an embodiment of 4’33" from the point
    of view of the performer(s) onstage. On the other hand, Implementation A, which
    contains not only Implementation B in its entirety, but also goes to lengths to
    connect the live audio input (adc) to the audio output (dac), foregrounding not
    the sound made by the software program, but rather the incidental sounds of the
    room. This is fitting of 4’33" in a different sense. In Cage’s original work,
    the incidental sounds of the room that accompanies the absence of instrumental
    sounds onstage, are an essential part of the piece itself, inviting audiences
    to contemplate the nature of musical performances as well as what may constitute
    a performance in the first place. Under this interpretation, Implementation A
    nods to the acoustic, social, and cultural contexts in which the piece is performed.'
