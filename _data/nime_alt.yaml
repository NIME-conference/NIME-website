- ENTRYTYPE: inproceedings
  ID: nime2026_alt_2
  abstract: 'This work compiles radical interaction, a series of interviews with NIME
    and HCI researchers and artists. Inspired by the timely arrival of the first alt.nime
    at the 2026 conference, we consider an alternative method of bringing our ideas
    to NIME, presenting a series of eight audio interviews as a linked podcast, zine
    and online interactive website that plays with this year’s theme of community.
    We present a standard linear view of the episodes alongside a shared listening
    experience, where a community of listeners interact with each other through an
    entangled listening experience that changes depending on how many concurrent listeners
    are actively listening. The accompanying zine, circulated in physical form at
    the conference, guides listeners through the processes and ideas of the podcast,
    as a tool for engaging with a shared listening experience and the collision of
    ideas radical interaction represents.'
  address: 'London, United Kingdom'
