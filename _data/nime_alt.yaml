- ENTRYTYPE: inproceedings
  ID: nime2026_alt_6
  abstract: 'Transcending conventional modes of documentation in NIME, this submission
    presents ``No-gos, Incidents, Malfunctions and Errors: The Encyclopedia of Failed
    Performances'''', an ongoing zine series where stories about ``failed''''performances
    are shared among the community. The issues of the zine are provocatively organised
    in an alphabetical order akin to an encyclopedia in stark contrast with the complex
    and often unclassifiable nature of the subject matter. Through an open call, we
    bring together first-hand accounts of moments when self-built instruments misbehave,
    systems jam, sounds fail to emerge, or live setups resist control. By collecting
    these stories and creating a space for sharing, our project aims to promote reflection
    on what these situations potentially reveal about artistic intention, situational
    adaptation, and the relationship between performers and technology.'
